<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诡道仙途 - 中式克苏鲁文字冒险</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap');
        
        :root {
            --blood-red: #8B0000;
            --dark-blood: #4a0000;
            --pale-flesh: #d4c5b0;
            --rot-green: #2d4a3e;
            --void-black: #0a0a0a;
            --bone-white: #e8e0d5;
            --incense-gold: #c9a227;
            --spirit-blue: #1a3a4a;
            --madness-purple: #3d1a4a;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Serif SC', serif;
            background: #050505;
            color: var(--bone-white);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 全屏场景背景 */
        #scene-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 0;
            filter: brightness(0.4) saturate(0.8) sepia(0.05);
        }
        #scene-bg.active { opacity: 1; }
        #scene-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.45) 100%);
        }
        
        @keyframes symbolPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.4; }
        }
        
        /* 立绘区域 */
        #portrait-area {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 200px;
            height: 380px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: none;
            transition: opacity 0.8s ease;
            opacity: 0;
        }
        #portrait-area.visible { opacity: 1; }
        
        .portrait-card {
            width: 180px;
            height: 340px;
            border: 2px solid rgba(139, 0, 0, 0.6);
            border-radius: 8px;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.4);
            overflow: hidden;
            position: relative;
        }
        .portrait-card.entering {
            animation: portraitEnter 0.8s ease forwards;
        }
        @keyframes portraitEnter {
            0% { opacity: 0; transform: translateX(40px); box-shadow: 0 0 0 rgba(139,0,0,0); }
            40% { box-shadow: 0 0 60px rgba(139, 0, 0, 0.9); }
            100% { opacity: 1; transform: translateX(0); box-shadow: 0 0 30px rgba(139,0,0,0.4); }
        }
        .portrait-name {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(10,10,10,0.98));
            padding: 40px 10px 10px;
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 14px;
            color: var(--incense-gold);
            text-align: center;
            letter-spacing: 3px;
        }
        .portrait-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: top;
            filter: contrast(1.15) saturate(0.5) brightness(0.75) sepia(0.25);
        }
        .portrait-card .portrait-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(160deg, rgba(139,0,0,0.12) 0%, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
        }
        
        #game-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }
        
        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease;
        }
        #title-screen::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=60') center/cover no-repeat;
            opacity: 0.15;
            filter: brightness(0.3) saturate(0.5);
        }
        #title-screen > * { position: relative; z-index: 1; }
        
        #title-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .title-char {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 120px;
            color: var(--blood-red);
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.8), 0 0 40px rgba(139, 0, 0, 0.6), 0 0 60px rgba(139, 0, 0, 0.4);
            animation: breathe 4s ease-in-out infinite;
            letter-spacing: 20px;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.3); }
        }
        
        .subtitle {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 24px;
            color: var(--pale-flesh);
            margin-top: 30px;
            letter-spacing: 8px;
            opacity: 0.8;
        }
        
        .start-btn {
            margin-top: 60px;
            padding: 15px 60px;
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 20px;
            background: transparent;
            border: 2px solid var(--blood-red);
            color: var(--bone-white);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 4px;
        }
        
        .start-btn:hover {
            background: var(--blood-red);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.6);
            transform: translateY(-2px);
        }
        
        #game-ui {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        
        #game-ui.active { display: flex; }
        
        #status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(26, 10, 10, 0.9);
            border: 1px solid var(--dark-blood);
            border-radius: 5px;
            font-family: 'ZCOOL XiaoWei', serif;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-label { color: var(--pale-flesh); font-size: 14px; }
        .stat-value { font-size: 18px; font-weight: bold; }
        
        .stat-bar {
            width: 100px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .stat-fill { height: 100%; transition: width 0.5s ease; }
        .sanity-fill { background: linear-gradient(90deg, var(--spirit-blue), var(--madness-purple)); }
        .corruption-fill { background: linear-gradient(90deg, var(--rot-green), var(--blood-red)); }
        .cultivation-fill { background: linear-gradient(90deg, var(--incense-gold), #ffd700); }
        
        #text-area {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid rgba(139, 0, 0, 0.3);
            border-radius: 8px;
            padding: 30px 40px;
            min-height: 300px;
            position: relative;
            overflow: hidden;
        }
        
        .location-header {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 32px;
            color: var(--blood-red);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(139, 0, 0, 0.3);
            text-align: center;
        }
        
        .narrative {
            font-size: 17px;
            line-height: 1.9;
            color: var(--bone-white);
            margin-bottom: 15px;
            text-indent: 2em;
        }
        
        .dialogue {
            margin: 20px 0;
            padding: 15px 20px;
            border-left: 3px solid var(--incense-gold);
            background: rgba(201, 162, 39, 0.05);
            font-style: italic;
        }
        
        .speaker {
            color: var(--incense-gold);
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .madness-text {
            color: var(--madness-purple);
            font-style: italic;
        }
        
        .secret-text {
            color: var(--blood-red);
            font-family: 'Ma Shan Zheng', cursive;
            cursor: help;
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        
        #choices-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .choice-btn {
            padding: 15px 25px;
            background: rgba(26, 10, 10, 0.8);
            border: 1px solid rgba(139, 0, 0, 0.5);
            color: var(--bone-white);
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .choice-btn::before {
            content: '▶';
            margin-right: 12px;
            color: var(--blood-red);
            transition: transform 0.3s ease;
        }
        
        .choice-btn:hover {
            background: rgba(139, 0, 0, 0.3);
            border-color: var(--blood-red);
            transform: translateX(10px);
        }
        
        .choice-btn:hover::before { transform: translateX(5px); }
        
        .choice-cost {
            font-size: 12px;
            color: var(--blood-red);
            margin-left: auto;
            opacity: 0.8;
        }
        
        #inventory {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: rgba(26, 10, 10, 0.9);
            border: 1px solid var(--dark-blood);
            border-radius: 5px;
            flex-wrap: wrap;
        }
        
        .item {
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--rot-green);
            border-radius: 3px;
            font-size: 14px;
            color: var(--pale-flesh);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .item:hover {
            background: rgba(45, 74, 62, 0.5);
            border-color: var(--incense-gold);
        }
        
        .blood-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(139, 0, 0, 0.3) 100%);
            opacity: 0;
            transition: opacity 2s ease;
            z-index: 999;
        }
        
        .corruption-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }
        
        .blood-vignette.active { opacity: 1; }
        
        #log-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(26, 10, 10, 0.9);
            border: 1px solid var(--dark-blood);
            color: var(--bone-white);
            cursor: pointer;
            font-family: 'ZCOOL XiaoWei', serif;
            z-index: 101;
            transition: right 0.3s ease;
        }
        
        #game-log ~ #log-toggle {
            right: 20px;
        }
        
        #game-log.open ~ #log-toggle {
            right: 420px;
        }
        
        #game-log {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100%;
            background: rgba(10, 10, 10, 0.98);
            border-left: 1px solid var(--dark-blood);
            padding: 20px;
            overflow-y: auto;
            transition: right 0.3s ease;
            z-index: 100;
        }
        
        #game-log.open { right: 0; }
        
        .log-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(139, 0, 0, 0.5);
            border: 1px solid var(--blood-red);
            color: var(--bone-white);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            display: none;
        }
        
        #game-log.open .log-close { display: block; }
        
        .log-entry {
            padding: 10px 0;
            border-bottom: 1px solid rgba(139, 0, 0, 0.2);
            font-size: 14px;
        }
        
        #ending-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--void-black);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #ending-screen.active { display: flex; }
        
        .ending-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 60px;
            color: var(--blood-red);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .ending-text {
            max-width: 600px;
            text-align: center;
            font-size: 18px;
            line-height: 2;
            color: var(--pale-flesh);
            padding: 0 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in { animation: fadeIn 0.8s ease forwards; }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        .glitch { animation: glitch 0.3s ease infinite; }
        
        @media (max-width: 768px), (orientation: portrait) {
            .title-char { font-size: 48px; letter-spacing: 8px; }
            .subtitle { font-size: 14px; letter-spacing: 4px; }
            .start-btn { padding: 12px 40px; font-size: 16px; }
            
            #status-bar {
                padding: 10px 12px;
                gap: 8px;
            }
            .stat { gap: 5px; }
            .stat-label { font-size: 12px; }
            .stat-value { font-size: 14px; }
            .stat-bar { width: 50px; height: 6px; }
            
            #text-area { 
                padding: 15px; 
                min-height: 200px;
                border-radius: 5px;
            }
            .location-header { 
                font-size: 20px; 
                margin-bottom: 15px;
            }
            .narrative { 
                font-size: 15px; 
                line-height: 1.8;
                margin-bottom: 12px;
            }
            .dialogue { 
                padding: 10px 15px;
                margin: 15px 0;
            }
            .speaker { font-size: 14px; }
            
            .choice-btn {
                padding: 12px 18px;
                font-size: 14px;
                border-radius: 4px;
            }
            .choice-btn::before { margin-right: 8px; }
            .choice-cost { font-size: 11px; }
            
            #inventory {
                padding: 10px;
                gap: 8px;
            }
            .item {
                padding: 6px 12px;
                font-size: 12px;
            }
            
            .ending-title { font-size: 36px; }
            .ending-text { font-size: 15px; line-height: 1.8; }
            
            #game-log {
                width: 100%;
                right: -100%;
            }
            #game-log.open ~ #log-toggle { right: 20px; }
            #log-toggle { 
                bottom: 15px; 
                right: 15px; 
                padding: 8px 16px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 1100px) {
            #portrait-area { display: none; }
        }
        @media (max-width: 768px), (orientation: portrait) {
            #scene-bg { filter: brightness(0.18) saturate(0.6); }
            .title-char { font-size: 48px; letter-spacing: 8px; }
            .subtitle { font-size: 14px; letter-spacing: 4px; }
        @keyframes panicShake {
            0%, 100% { transform: translate(0); }
            10% { transform: translate(-8px, 3px); }
            20% { transform: translate(8px, -3px); }
            30% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            50% { transform: translate(-3px, 3px); }
            60% { transform: translate(3px, -3px); }
            70% { transform: translate(-2px, 2px); }
            80% { transform: translate(2px, -2px); }
            90% { transform: translate(-1px, 1px); }
        }
        
        .panic-mode {
            animation: panicShake 0.15s ease infinite;
        }
        
        .sanity-critical {
            color: #ff4444 !important;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }
        
        .corruption-critical {
            color: #00ff00 !important;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
        }
        
        .stat-value.sanity-critical {
            animation: pulse 0.5s ease infinite alternate;
        }
        
        .stat-value.corruption-critical {
            animation: pulse 0.5s ease infinite alternate;
        }
        
        @keyframes pulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.6; transform: scale(1.1); }
        }
        
        @keyframes corruptionPulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        
        .corruption-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
            transition: opacity 1s ease;
        }
        
        @keyframes sanityFlicker {
            0%, 100% { opacity: 0; }
            10%, 30%, 50%, 70%, 90% { opacity: 0.4; }
            20%, 40%, 60%, 80% { opacity: 0; }
        }
        
        .sanity-warning-overlay {
            background: radial-gradient(ellipse at center, transparent 30%, rgba(61, 26, 74, 0.5) 100%);
            animation: sanityFlicker 3s ease infinite;
        }
        
        @keyframes corruptionSpread {
            0% { background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 100, 0, 0.2) 100%); }
            50% { background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 150, 0, 0.3) 100%); }
            100% { background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 200, 0, 0.4) 100%); }
        }
        
        .corruption-warning-overlay {
            animation: corruptionSpread 2s ease infinite;
            opacity: 0;
        }
        
        @keyframes corruptionMaxOverlay {
            0%, 100% { opacity: 0.5; background: radial-gradient(ellipse at center, transparent 20%, rgba(0, 255, 0, 0.3) 100%); }
            50% { opacity: 1; background: radial-gradient(ellipse at center, transparent 10%, rgba(0, 255, 0, 0.5) 100%); }
        }
        
        .corruption-max-overlay {
            animation: corruptionMaxOverlay 1s ease infinite;
            opacity: 1 !important;
        }
            #title-screen { padding: 20px; }
            .title-char { font-size: 60px; }
            .subtitle { margin-top: 15px; font-size: 18px; }
            .start-btn { margin-top: 30px; }
        }
    </style>
</head>
<body>
    <div id="title-screen">
        <div class="title-char">诡道仙途</div>
        <div class="subtitle">世人皆求仙道，唯我窥见深渊</div>
        <button class="start-btn" onclick="startGame()">踏入仙途</button>
    </div>
    
    <div id="scene-bg" class="scene-bg"></div>
    <div id="game-container">
        <div id="portrait-area" class="portrait-area"></div>
        <div id="game-ui">
            <div id="status-bar">
                <div class="stat">
                    <span class="stat-label">神智</span>
                    <div class="stat-bar">
                        <div class="stat-fill sanity-fill" id="sanity-bar" style="width: 100%"></div>
                    </div>
                    <span class="stat-value" id="sanity-value">100</span>
                </div>
                <div class="stat">
                    <span class="stat-label">污染</span>
                    <div class="stat-bar">
                        <div class="stat-fill corruption-fill" id="corruption-bar" style="width: 0%"></div>
                    </div>
                    <span class="stat-value" id="corruption-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">修为</span>
                    <div class="stat-bar">
                        <div class="stat-fill cultivation-fill" id="cultivation-bar" style="width: 10%"></div>
                    </div>
                    <span class="stat-value" id="cultivation-value">炼气一层</span>
                </div>
            </div>
            
            <div id="inventory"></div>
            
            <div id="text-area">
                <div class="location-header" id="location-name">青云宗·入门试炼</div>
                <div id="narrative-box"></div>
            </div>
            
            <div id="choices-area"></div>
        </div>
    </div>
    
    <div class="blood-vignette" id="blood-vignette"></div>
    <div class="corruption-vignette corruption-warning-overlay" id="corruption-vignette"></div>
    <div class="corruption-vignette sanity-warning-overlay" id="sanity-vignette"></div>
    
    <button id="log-toggle" onclick="toggleLog()">阅历录</button>
    <div id="game-log">
        <button class="log-close" onclick="toggleLog()">×</button>
        <h3 style="color: var(--blood-red); margin-bottom: 20px; margin-top: 10px; font-family: 'ZCOOL XiaoWei', serif;">阅历录</h3>
        <div id="log-entries"></div>
    </div>
    
    <div id="ending-screen">
        <div class="ending-title" id="ending-title"></div>
        <div class="ending-text" id="ending-text"></div>
        <button class="start-btn" style="margin-top: 40px;" onclick="restartGame()">重入仙途</button>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            sanity: 100,
            corruption: 0,
            cultivation: 10,
            cultivationStage: '炼气一层',
            inventory: { '黄符': 3, '镇魂香': 1 },
            flags: {},
            visitedScenes: []
        };
        
        // 场景定义
        const scenes = {
            'start': {
                location: '青云宗·山门',
                narrative: [
                    '晨雾未散，青云宗的山门若隐若现。你站在石阶前，仰望着这座传说中的仙门。',

        // 辅助函数
        function getCultivationStage() {
            const c = gameState.cultivation;
            if (c < 20) return '炼气一层';
            if (c < 40) return '炼气三层';
            if (c < 60) return '炼气五层';
            if (c < 80) return '筑基初期';
            return '筑基中期';
        }
        
        // 游戏逻辑函数
        function startGame() {
            document.getElementById('title-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.add('active');
            loadScene('start');
        }
        
        function loadScene(sceneId) {
            const scene = scenes[sceneId];
            if (!scene) {
                console.error('Scene not found:', sceneId);
                handleMissingScene(sceneId);
                return;
            }
            
            currentScene = sceneId;
            gameState.visitedScenes.push(sceneId);
            
            // 切换场景背景
            updateSceneBackground(scene, sceneId);
            
            // 显示立绘（如果场景有的话）
            updateScenePortrait(scene);
            
            document.getElementById('location-name').textContent = scene.location;
            const narrativeBox = document.getElementById('narrative-box');
            narrativeBox.innerHTML = '';
            
            scene.narrative.forEach((text, index) => {
                setTimeout(() => {
                    const p = document.createElement('p');
                    p.className = 'narrative fade-in';
                    p.innerHTML = text;
                    narrativeBox.appendChild(p);
                    narrativeBox.scrollTop = narrativeBox.scrollHeight;
                }, index * 800);
            });
            
            if (scene.dialogue) {
                setTimeout(() => {
                    const dialogueDiv = document.createElement('div');
                    dialogueDiv.className = 'dialogue fade-in';
                    dialogueDiv.innerHTML = '<div class="speaker">' + scene.dialogue.speaker + '</div><div>' + scene.dialogue.text + '</div>';
                    narrativeBox.appendChild(dialogueDiv);
                }, scene.narrative.length * 800 + 500);
            }
            
            if (scene.effects) applyEffects(scene.effects);
            if (scene.flags) Object.assign(gameState.flags, scene.flags);
            if (scene.inventory) {
                for (const [item, count] of Object.entries(scene.inventory)) {
                    if (!gameState.inventory[item]) gameState.inventory[item] = 0;
                    gameState.inventory[item] += count;
                    if (gameState.inventory[item] <= 0) delete gameState.inventory[item];
                }
                updateInventoryDisplay();
            }
            
            setTimeout(() => {
                showChoices(scene.choices);
            }, scene.narrative.length * 800 + (scene.dialogue ? 1000 : 500));
            
            if (scene.ending) {
                setTimeout(() => {
                    showEnding(scene.ending);
                }, scene.narrative.length * 800 + 2000);
            }
            
            addToLog(scene.location, scene.narrative[0]);
            updateVisualEffects();
        }
        
        function applyEffects(effects) {
            if (effects.sanity !== undefined) gameState.sanity = Math.max(0, Math.min(100, gameState.sanity + effects.sanity));
            if (effects.corruption !== undefined) gameState.corruption = Math.max(0, Math.min(100, gameState.corruption + effects.corruption));
            if (effects.cultivation !== undefined) {
                gameState.cultivation = Math.max(0, Math.min(100, gameState.cultivation + effects.cultivation));
                gameState.cultivationStage = getCultivationStage();
            }
            updateStatusBars();
            updateVisualEffects();
            if (checkExtremeStates()) return;
        }

        // 检查极端状态 - 神智归0或污染满值触发严重后果
        function checkExtremeStates() {
            if (gameState.sanity <= 0 && !gameState.flags.sanityCollapseTriggered) {
                gameState.flags.sanityCollapseTriggered = true;
                triggerSanityCollapse();
                return true;
            }
            if (gameState.corruption >= 100 && !gameState.flags.corruptionMaxTriggered) {
                gameState.flags.corruptionMaxTriggered = true;
                triggerCorruptionMax();
                return true;
            }
            return false;
        }

        function parseAndApplyCost(costString) {
            const parts = costString.split(',');
            parts.forEach(part => {
                const trimmed = part.trim();
                const match = trimmed.match(/(神智|污染|修为)([+-]\d+)/);
                if (match) {
                    const stat = match[1];
                    const value = parseInt(match[2]);
                    if (stat === '神智') gameState.sanity = Math.max(0, Math.min(100, gameState.sanity + value));
                    if (stat === '污染') gameState.corruption = Math.max(0, Math.min(100, gameState.corruption + value));
                    if (stat === '修为') {
                        gameState.cultivation = Math.max(0, Math.min(100, gameState.cultivation + value));
                        gameState.cultivationStage = getCultivationStage();
                    }
                }
            });
            updateStatusBars();
            updateVisualEffects();
            checkExtremeStates();
        }
        
        function handleMissingScene(actionId) {
            const narrativeBox = document.getElementById('narrative-box');
            narrativeBox.innerHTML = '<p class="narrative fade-in">命运的齿轮继续转动......</p>';
            
            setTimeout(() => {
                // 根据状态决定结局
                if (gameState.corruption >= 70 || gameState.flags.accepted_taishui) {
                    loadScene('ending_corrupted');
                } else if (gameState.flags.know_truth && gameState.sanity >= 30) {
                    loadScene('ending_resist');
                } else if (gameState.sanity < 30) {
                    loadScene('ending_escape');
                } else {
                    // 继续剧情
                    const nextScenes = ['first_trial', 'second_trial', 'third_trial', 'disciple_life', 'seek_truth'];
                    const unvisited = nextScenes.filter(s => !gameState.visitedScenes.includes(s));
                    if (unvisited.length > 0) {
                        loadScene(unvisited[0]);
                    } else {
                        loadScene('ending_resist');
                    }
                }
            }, 2000);
        }
        
        function updateVisualEffects() {
            const bloodVignette = document.getElementById('blood-vignette');
            const corruptionVignette = document.getElementById('corruption-vignette');
            const sanityVignette = document.getElementById('sanity-vignette');
            
            // 血红色边框 - 污染 > 30
            if (gameState.corruption > 30) {
                bloodVignette.classList.add('active');
                bloodVignette.style.opacity = Math.min(0.8, (gameState.corruption - 30) / 70);
            } else {
                bloodVignette.classList.remove('active');
                bloodVignette.style.opacity = 0;
            }
            
            // 污染警告 - 80-99
            if (gameState.corruption >= 80 && gameState.corruption < 100) {
                corruptionVignette.style.opacity = (gameState.corruption - 80) / 20;
                corruptionVignette.classList.add('corruption-warning-overlay');
                corruptionVignette.classList.remove('corruption-max-overlay');
            } else if (gameState.corruption >= 100) {
                corruptionVignette.style.opacity = 1;
                corruptionVignette.classList.remove('corruption-warning-overlay');
                corruptionVignette.classList.add('corruption-max-overlay');
            } else {
                corruptionVignette.style.opacity = 0;
                corruptionVignette.classList.remove('corruption-warning-overlay', 'corruption-max-overlay');
            }
            
            // 神智警告 - 低于20
            if (gameState.sanity <= 20 && gameState.sanity > 0) {
                sanityVignette.style.opacity = (20 - gameState.sanity) / 20;
                const sanityVal = document.getElementById('sanity-value');
                const sanityBar = document.getElementById('sanity-bar');
                if (sanityVal) sanityVal.classList.add('sanity-critical');
                if (sanityBar) sanityBar.classList.add('sanity-critical');
            } else {
                sanityVignette.style.opacity = 0;
                const sanityVal = document.getElementById('sanity-value');
                const sanityBar = document.getElementById('sanity-bar');
                if (sanityVal) sanityVal.classList.remove('sanity-critical');
                if (sanityBar) sanityBar.classList.remove('sanity-critical');
            }
            
            // 污染值临界高亮
            const corruptionVal = document.getElementById('corruption-value');
            const corruptionBar = document.getElementById('corruption-bar');
            if (gameState.corruption >= 80) {
                if (corruptionVal) corruptionVal.classList.add('corruption-critical');
                if (corruptionBar) corruptionBar.classList.add('corruption-critical');
            } else {
                if (corruptionVal) corruptionVal.classList.remove('corruption-critical');
                if (corruptionBar) corruptionBar.classList.remove('corruption-critical');
            }
        }
        
        function updateInventoryDisplay() {
            const inventory = document.getElementById('inventory');
            inventory.innerHTML = '';
            
            for (const [item, count] of Object.entries(gameState.inventory)) {
                if (count > 0) {
                    const div = document.createElement('div');
                    div.className = 'item';
                    div.textContent = item + '×' + count;
                    div.onclick = () => useItem(item);
                    inventory.appendChild(div);
                }
            }
        }
        
        function useItem(itemName) {
            if (gameState.inventory[itemName] && gameState.inventory[itemName] > 0) {
                gameState.inventory[itemName]--;
                if (gameState.inventory[itemName] <= 0) delete gameState.inventory[itemName];
                
                switch (itemName) {
                    case '黄符':
                        addToLog('使用', '黄符 - 神智+10, 污染-5');
                        gameState.sanity = Math.min(100, gameState.sanity + 10);
                        gameState.corruption = Math.max(0, gameState.corruption - 5);
                        break;
                    case '镇魂香':
                        addToLog('使用', '镇魂香 - 神智+25');
                        gameState.sanity = Math.min(100, gameState.sanity + 25);
                        break;
                    case '血色丹药':
                        addToLog('使用', '血色丹药 - 修为+15, 污染+10');
                        gameState.cultivation = Math.min(100, gameState.cultivation + 15);
                        gameState.corruption = Math.min(100, gameState.corruption + 10);
                        gameState.cultivationStage = getCultivationStage();
                        break;
                    case '古玉碎片':
                        addToLog('使用', '古玉碎片发出微弱的光芒...');
                        break;
                }
                
                updateStatusBars();
                updateInventoryDisplay();
            }
        }
        
        function addToLog(type, content) {
            const logEntries = document.getElementById('log-entries');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = '<strong>' + type + '</strong>: ' + content.substring(0, 50) + (content.length > 50 ? '...' : '');
            logEntries.insertBefore(entry, logEntries.firstChild);
        }
        
        function toggleLog() {
            document.getElementById('game-log').classList.toggle('open');
        }
        
        function showEnding(ending) {
            const endingScreen = document.getElementById('ending-screen');
            document.getElementById('ending-title').textContent = ending.title;
            document.getElementById('ending-text').textContent = ending.text;
            endingScreen.classList.add('active');
        }
        
        function restartGame() {
            gameState.sanity = 100;
            gameState.corruption = 0;
            gameState.cultivation = 10;
            gameState.cultivationStage = '炼气一层';
            gameState.inventory = { '黄符': 3, '镇魂香': 1 };
            gameState.flags = {};
            gameState.visitedScenes = [];
            
            updateStatusBars();
            updateInventoryDisplay();
            
            document.getElementById('ending-screen').classList.remove('active');
            document.getElementById('game-ui').classList.remove('active');
            document.getElementById('title-screen').classList.remove('hidden');
            
            document.getElementById('log-entries').innerHTML = '';
            document.getElementById('narrative-box').innerHTML = '';
            document.getElementById('choices-area').innerHTML = '';
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateStatusBars();
            updateInventoryDisplay();
        });
    </script>
</body>
</html>
